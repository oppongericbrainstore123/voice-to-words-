name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Create a fresh Flutter project
        run: flutter create --org com.example --project-name voice_notes --platforms=android app
      - name: Copy in my code
        run: cp "$(find github -name main.dart | head -n 1)" app/lib/main.dart
      - name: Add packages
        working-directory: app
        run: flutter pub add sqflite path path_provider record audioplayers pdf share_plus google_mlkit_translation archive:^3.6.1 whisper_flutter_new shared_preferences file_picker
      - name: Allow microphone and internet
        run: sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <application#' app/android/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: voice-notes-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
