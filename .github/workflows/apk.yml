name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16.x'

      - name: Generate APK from Web App
        uses: darkshredder/website-to-apk-action@v1.0.0
        with:
          build-folder-path: '.'
          app-name: 'VoiceToWords'
          output-folder-path: 'apk'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v2
        with:
          name: voice-to-words-apk
          path: apk/
