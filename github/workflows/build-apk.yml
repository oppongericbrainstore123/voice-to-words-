name: Convert Website to APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16.x'

      - name: Run Website to APK Action
        uses: darkshredder/website-to-apk-action@v1.0.0
        with:
          build-folder-path: '.'   # Uses your root folder where index.html is located
          app-name: 'VoiceToWords'
          output-folder-path: 'apk'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v2
        with:
          name: app-apk
          path: apk/
